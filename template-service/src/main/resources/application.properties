# Quarkus Configuration

# Application
quarkus.application.name=template-service
quarkus.application.version=1.0.0

# Drools Extension Configuration
quarkus.drools.rule-files=rules/transaction-processing-rules.drl

# Kafka Extension Configuration
mp.messaging.incoming.transactions.connector=smallrye-kafka
mp.messaging.incoming.transactions.topic=transactions
mp.messaging.incoming.transactions.bootstrap.servers=localhost:9092
mp.messaging.incoming.transactions.group.id=template-service-consumer
mp.messaging.incoming.transactions.auto.offset.reset=earliest

# PostgreSQL Extension Configuration
quarkus.postgres.database=quarkus_db
quarkus.postgres.schema=public
quarkus.postgres.enable-logging=false
quarkus.postgres.max-pool-size=20
quarkus.postgres.min-pool-size=5

# Datasource Configuration
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus_db
quarkus.datasource.username=quarkus_user
quarkus.datasource.password=quarkus_password
quarkus.datasource.db-kind=postgresql

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.neversoft".level=DEBUG
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.hibernate.SQL".level=INFO
